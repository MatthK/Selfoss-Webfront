name: selfoss-webfront

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-selfoss}
      MYSQL_USER: ${MYSQL_USER:-selfoss}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --disable-log-bin
    volumes:
      - db-data:/var/lib/mysql
      - ./config/mysql.cnf:/etc/mysql/conf.d/selfoss-webfront.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # The image is built locally from this repository. Multi-arch release
    # images are also published as matthk72/selfoss-wf on Docker Hub (see
    # .github/workflows/docker-release.yml). To run a published release
    # instead of building, remove the "build" and "pull_policy" lines.
    image: matthk72/selfoss-wf:latest
    pull_policy: build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEBFRONT_PORT:-80}:80"
      - "${SELFOSS_PORT:-8080}:8080"
    environment:
      # Shared database credentials (also see .env)
      SWF_DB_HOST: db
      SWF_DB_NAME: ${MYSQL_DATABASE:-selfoss}
      SWF_DB_USER: ${MYSQL_USER:-selfoss}
      SWF_DB_PASSWORD: ${MYSQL_PASSWORD}
      SELFOSS_DB_HOST: db
      SELFOSS_DB_DATABASE: ${MYSQL_DATABASE:-selfoss}
      SELFOSS_DB_USERNAME: ${MYSQL_USER:-selfoss}
      SELFOSS_DB_PASSWORD: ${MYSQL_PASSWORD}
      # Seconds between automatic selfoss feed updates (0 = disabled)
      SELFOSS_UPDATE_INTERVAL: ${SELFOSS_UPDATE_INTERVAL:-900}
    volumes:
      - selfoss-data:/var/www/html/data
      - ./config/selfoss.ini:/var/www/html/data/config.ini:ro
      - ./config/constants.php:/var/www/webfront/includes/constants.php:ro

volumes:
  db-data:
  selfoss-data:
