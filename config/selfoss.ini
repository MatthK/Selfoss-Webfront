; Selfoss configuration for the bundled Docker setup.
;
; Database credentials are supplied through environment variables
; (SELFOSS_DB_*) by docker-compose.yml, so no secrets live in this file.
; All other settings follow the upstream defaults, see
; https://selfoss.aditu.de for documentation.

[globals]
db_type=mysql
db_host=db
db_database=selfoss
db_username=selfoss
db_password=
db_port=3306
env_prefix=selfoss_

logger_destination=file:data/logs/default.log
logger_level=ERROR

items_perpage=50
items_lifetime=90

; base_url is only needed when selfoss is behind a reverse proxy under a path
base_url=

; Access control for the selfoss UI on port 8080.
; With empty username/password selfoss runs in public mode: everyone who can
; reach the port has full admin access. If you expose the stack beyond your
; trusted network, set a username and password hash (see README).
username=
password=
salt=

html_title=selfoss
rss_title=selfoss feed
rss_max_items=300
homepage=newest
language=0
auto_mark_as_read=0
auto_collapse=0
auto_stream_more=1
share=gtfpde
load_images_on_mobile=0
auto_hide_read_on_mobile=0
